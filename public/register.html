<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — AccessoryHub</title><link rel="stylesheet" href="css/style.css"></head><body><header><a class="logo" href="index.html">Accessory<span>Hub</span></a><nav><a href="index.html">Главная</a></nav></header><main class="auth-page"><section class="auth-card"><h1 id="formTitle">Создать аккаунт</h1><p class="muted" id="formSubtitle">Зарегистрируйтесь, чтобы сохранить аккаунт.</p><form id="authForm"><label id="nameLabel">Имя<input id="name" required placeholder="Ваше имя" autocomplete="name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com" autocomplete="email"></label><label>Пароль<input id="password" type="password" minlength="8" required placeholder="Минимум 8 символов" autocomplete="new-password"></label><button id="submitBtn" class="btn full">Зарегистрироваться</button><p id="message" class="message"></p></form><button id="switchMode" class="link-btn" type="button">Уже есть аккаунт? Войти</button><a class="back" href="index.html">← Вернуться на главную</a></section></main><script src="js/auth.js"></script></body></html>
